<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; border-radius: 20px; padding: 50px 40px; width: 100%; max-width: 420px; margin: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); text-align: center; }
        .login-box .icon { font-size: 3rem; color: #0d9488; margin-bottom: 10px; }
        .login-box h1 { font-size: 1.5rem; margin-bottom: 6px; }
        .login-box p { color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: #94a3b8; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 10px; margin-bottom: 20px; display: none; font-size: 0.95rem; text-align: center; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .back-link a:hover { color: #0d9488; }
        .google-btn-wrapper { display: flex; justify-content: center; min-height: 50px; }
        .login-hint { color: #94a3b8; font-size: 0.8rem; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon"><i class="fas fa-shield-alt"></i></div>
        <h1>لوحة التحكم</h1>
        <p>سجل الدخول باستخدام حساب Google</p>
        <div class="error-msg" id="errorMsg"></div>

        <div class="google-btn-wrapper" id="googleButton"></div>

        <div class="login-hint">يُسمح فقط للحسابات المصرح لها</div>
        <div class="back-link"><a href="../index.html"><i class="fas fa-arrow-right"></i> العودة إلى الموقع</a></div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        var API_URL = 'http://localhost:5000';
        var GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID';

        function handleGoogleCredential(response) {
            var err = document.getElementById('errorMsg');
            err.style.display = 'none';

            fetch(API_URL + '/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: response.credential })
            })
            .then(function(resp) {
                if (!resp.ok) return resp.json().then(function(d) { throw new Error(d.error || 'خطأ في تسجيل الدخول'); });
                return resp.json();
            })
            .then(function(data) {
                sessionStorage.setItem('adminToken', data.token);
                sessionStorage.setItem('adminEmail', data.email);
                sessionStorage.setItem('adminName', data.name || data.email);
                window.location.href = 'dashboard.html';
            })
            .catch(function(error) {
                err.textContent = error.message || 'فشل تسجيل الدخول بحساب Google';
                err.style.display = 'block';
            });
        }

        if (sessionStorage.getItem('adminToken')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
