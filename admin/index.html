<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; border-radius: 20px; padding: 50px 40px; width: 100%; max-width: 420px; margin: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .login-box .icon { text-align: center; font-size: 3rem; color: #0d9488; margin-bottom: 10px; }
        .login-box h1 { text-align: center; font-size: 1.5rem; margin-bottom: 6px; }
        .login-box p { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #0d9488; box-shadow: 0 0 0 4px rgba(13,148,136,0.1); }
        .btn-login { width: 100%; padding: 16px; background: #0d9488; color: #fff; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #0f766e; transform: translateY(-2px); }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 10px; margin-bottom: 20px; display: none; font-size: 0.95rem; text-align: center; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .back-link a:hover { color: #0d9488; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon"><i class="fas fa-shield-alt"></i></div>
        <h1>لوحة التحكم</h1>
        <p>أدخل بيانات الدخول للوصول إلى قاعدة البيانات</p>
        <div class="error-msg" id="errorMsg"></div>
        <form onsubmit="return adminLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> دخول</button>
        </form>
        <div class="back-link"><a href="../index.html"><i class="fas fa-arrow-right"></i> العودة إلى الموقع</a></div>
    </div>
    <script>
        function adminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin' && p === 'admin123') {
                sessionStorage.setItem('adminAuth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('errorMsg');
                err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
                err.style.display = 'block';
            }
            return false;
        }
        if (sessionStorage.getItem('adminAuth') === 'true') window.location.href = 'dashboard.html';
    </script>
</body>
</html>
